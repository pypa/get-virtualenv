name: 🛡️ CodeQL
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "12 9 * * 2"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@7f521def2d390ad786d8d29a28f1bc56dad0cde9 # 6.5.6
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions"]'
